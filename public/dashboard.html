<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title id="pageTitleTag">Admin Portal</title>
<link rel="stylesheet" href="/css/portal.css" />
</head>
<body>

<div class="app-shell">
  <aside class="sidebar">
    <div class="brand-row">
      <img id="brandLogo" class="brand-logo" src="" alt="" />
    </div>

    <div class="event-card">
      <div id="eventCardTitle" class="event-card-title"></div>
      <div class="event-card-row">
        <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>
        <span id="eventCardDates"></span>
      </div>
      <div class="event-card-row">
        <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z"/><circle cx="12" cy="10" r="3"/></svg>
        <span id="eventCardVenue"></span>
      </div>
    </div>

    <nav id="navList"></nav>
    <button class="logout-btn" id="logoutBtn">Log out</button>
  </aside>

  <main class="main">
    <div class="main-header">
      <h1 id="pageTitle">Loading…</h1>
      <button class="export-btn" id="exportBtn">⬇ Export Data</button>
    </div>

    <div id="overviewArea" class="overview-area" style="display:none;"></div>

    <div id="comingSoonArea" class="coming-soon-area" style="display:none;"></div>

    <div id="bulkUploadArea" class="bulk-upload-area" style="display:none;"></div>

    <div id="recordsView" style="display:none;">
      <div class="status-tabs" id="statusTabs"></div>

      <div class="filter-bar" id="filterBar"></div>

      <div class="search-summary" id="searchSummary"></div>

      <div class="table-wrap">
        <div id="tableArea"><div class="loading-state">Loading records…</div></div>
        <div class="table-footer">
          <span id="resultCount"></span>
          <div class="pager">
            <button id="prevPage">‹ Prev</button>
            <span id="pageIndicator">Page 1</span>
            <button id="nextPage">Next ›</button>
          </div>
        </div>
      </div>
    </div>
  </main>
</div>

<div class="modal-backdrop" id="modalBackdrop">
  <div class="modal-card">
    <h2>Record Details</h2>
    <div id="modalBody"></div>
    <button class="modal-close" id="modalClose">Close</button>
  </div>
</div>

<div class="modal-backdrop" id="editModalBackdrop">
  <div class="modal-card">
    <h2>Edit Record</h2>
    <div id="editModalBody"></div>
    <div class="modal-error" id="editModalError"></div>
    <div class="modal-actions">
      <button class="modal-cancel" id="editModalCancel">Cancel</button>
      <button class="modal-save" id="editModalSave">Save Changes</button>
    </div>
  </div>
</div>

<script src="/js/dashboard.js"></script>
</body>
</html>
